shell = "zsh"

[templates]
completions = 'fpath=("{{ dir }}/src" $fpath)'
highlighting = 'dotfiles_highlight_files=({% for file in files %} "{{ file }}"{% endfor %})'

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
rev = "b5e8e0a22deb05a807bb8655aef809a29f3cffed"
apply = ["completions"]

[plugins.compinit]
inline = 'autoload -Uz compinit; compinit'

# One directory-history provider; fzf and history search use the installed fzf CLI.
[plugins.z]
github = "knu/z"
rev = "1bd58681f820e2c08aa218a699f374aa19655708"
use = ["z.sh"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
rev = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"

# Widget wrapping runs last.
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
rev = "0bfcb582e71d3abe604ce67bc0fe5a21f377507e"
apply = ["highlighting"]
